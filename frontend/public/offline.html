<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00A651" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão — Worki</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: #f5f7f5;
        background-image: radial-gradient(at 0% 0%, rgba(0, 166, 81, 0.08) 0, transparent 55%);
        color: #111111;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px 24px;
        background: #ffffff;
        border: 2px solid #000000;
        border-radius: 24px;
        box-shadow: 6px 6px 0 0 #000000;
        text-align: left;
      }
      .logo {
        display: block;
        width: 64px;
        height: 64px;
        margin: 0 0 20px;
        border: 2px solid #000000;
        border-radius: 16px;
        background: #ffffff;
        object-fit: contain;
      }
      .tag {
        display: inline-block;
        margin: 0 0 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #e6f6ec;
        color: #008a42;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 900;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: #4b5563;
        font-size: 15px;
        line-height: 1.5;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        padding: 0 24px;
        border: 2px solid #000000;
        border-radius: 16px;
        background: #00a651;
        box-shadow: 3px 3px 0 0 #000000;
        color: #ffffff;
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .btn:hover {
        background: #008a42;
      }
      .btn:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }
      .btn:focus-visible {
        outline: 2px solid #000000;
        outline-offset: 3px;
      }
      .hint {
        margin: 16px 0 0;
        font-size: 13px;
        color: #6b7280;
      }
      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <img class="logo" src="/icon-192.png" width="64" height="64" alt="" />
      <span class="tag">Modo offline</span>
      <h1>Sem conexão com a internet</h1>
      <p>
        Não conseguimos carregar esta tela agora. Confira o Wi-Fi ou o sinal do celular e tente de novo — seus
        turnos e dados continuam salvos.
      </p>
      <a id="retry" class="btn" href="">Tentar de novo</a>
      <p class="hint">Assim que a conexão voltar, esta tela recarrega sozinha.</p>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
