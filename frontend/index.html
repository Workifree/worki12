    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Workyn",
            "url": "https://www.workyn.app",
            "logo": "https://www.workyn.app/favicon.svg"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Workyn",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web, Android, iOS",
            "inLanguage": "pt-BR",
            "url": "https://www.workyn.app",
            "description": "Sistema para restaurantes, bares e eventos organizarem sua equipe de freelas de confiança, preencherem turnos rapidamente, confirmarem presença no local e fecharem pagamentos com recibo.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "BRL"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "O Workyn cobra mensalidade ou comissão sobre o valor do freela?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Você começa grátis. O pagamento da diária continua sendo feito direto por você ao profissional (PIX ou dinheiro), enquanto o Workyn organiza a escala, a presença, os recibos e o fechamento do financeiro."
                }
              },
              {
                "@type": "Question",
                "name": "Preciso contratar desconhecidos ou posso usar meus próprios freelas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Você trabalha com quem já conhece. Basta enviar o link do seu Elenco para os freelas que já atendem sua empresa, organizar por função e chamar direto quando abrir um turno."
                }
              },
              {
                "@type": "Question",
                "name": "Funciona para empresas com vários encarregados ou mais de uma loja?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. Cada encarregado acessa apenas os próprios turnos, já vinculados à sua loja, e o Gestor acompanha toda a operação e o financeiro separados por loja e responsável."
                }
              },
              {
                "@type": "Question",
                "name": "Como o Workyn ajuda a controlar a recorrência de um mesmo freela?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Na hora de chamar um profissional, o Workyn mostra quantas vezes ele já trabalhou na semana na sua empresa para você distribuir os turnos com segurança."
                }
              },
              {
                "@type": "Question",
                "name": "O freela precisa baixar aplicativo na loja do celular?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Funciona direto no navegador do celular e pode ser salvo na Tela de Início com avisos no aparelho e por e-mail."
                }
              }
            ]
          }
        ]
      }
    </script>
